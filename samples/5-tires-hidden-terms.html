<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadready Tires – Checkout (TrueRate sample store)</title>
<link rel="stylesheet" href="store.css">
<style>:root { --brand: #18181b; --accent: #ca8a04; --accent-bg: #fefce8; --img: linear-gradient(135deg,#52525b,#09090b); }</style>
</head>
<body>
  <div class="nav"><span>ROADREADY TIRES</span><a href="index.html">← All sample stores</a></div>
  <div class="note">Made-up store for the TrueRate demo. Not a real business or lender.</div>
  <main>
    <section class="card">
      <h2>Your cart</h2>
      <div class="item">
        <div class="img"></div>
        <div><b>All-Season Tires, Set of 4 (installed)</b><br>Qty 1<br>Cash price: $640.00</div>
      </div>
      <div class="line" style="margin-top:16px"><span>Subtotal</span><span>$640.00</span></div>
      <div class="line"><span>Shipping</span><span>Free</span></div>
      <div class="line total"><span>Order total</span><span>$640.00</span></div>
    </section>
    <section class="card">
      <h2>Payment</h2>
      <div class="opt">Credit / debit card</div>
      <div id="promo-slot"><div class="fine">Loading more payment options…</div></div>
      <button>Place order</button>
    </section>
  </main>
  <template id="promo"><div class="opt promo">
          <b>Lease-to-own available!</b> No credit needed.<br>
          <span class="big">As low as $35 a week*</span><br>
          Drive away today.
          <div class="fine">*Lease terms and total cost shown after approval.</div>
        </div></template>
  <script>
    // Real checkout pages often load payment offers a moment after the page.
    // This copies that, so the demo shows TrueRate catching an offer that appears late.
    setTimeout(() => {
      document.getElementById("promo-slot").innerHTML = document.getElementById("promo").innerHTML;
    }, 1200);
  </script>
</body>
</html>
